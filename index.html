<style>
  :root {
    --ethical-blue: #2A52BE;
    --ethical-yellow: #D97706;
    --ethical-red: #DC2626;
    --ethical-teal: #0D9488;
    
    --bg: #f8f9fa;
    --panel: #ffffff;
    --panel-2: #f1f3f4;
    --line: #dadce0;
    --ink: #202124;
    --ink-dim: #3c4043;
    --muted: #5f6368;
    
    --accent: var(--ethical-blue);
    --accent-hover: #1e3a8a;
    --serif: 'Newsreader', Georgia, serif;
    --sans: 'Google Sans', 'Inter', system-ui, -apple-system, sans-serif;
    --maxw: 680px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.6;
  }

  .ethical-bar {
    height: 4px;
    width: 100%;
    background: linear-gradient(90deg, var(--ethical-blue) 0%, var(--ethical-yellow) 50%, var(--ethical-red) 100%);
  }

  #app {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 32px 24px 80px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #app.intro-app { padding-top: 12px; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 36px;
    margin-bottom: 24px;
    font-size: 14px;
    color: var(--muted);
  }

  .topbar button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 20px;
    transition: background 0.2s, color 0.2s;
  }
  .topbar button:hover { background: var(--panel-2); color: var(--ink); }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  main.intro-view { justify-content: flex-start; padding-top: 0; }

  .rings { display: block; width: 110px; height: 110px; margin: 0 auto 24px; }
  .rings circle {
    fill: none;
    stroke-width: 1.8;
    opacity: 0;
    transform-origin: center;
  }
  .rings circle:nth-child(1) { stroke: var(--ethical-blue); animation: ringIn 1s ease forwards 0.1s; }
  .rings circle:nth-child(2) { stroke: var(--ethical-yellow); animation: ringIn 1s ease forwards 0.3s; }
  .rings circle:nth-child(3) { stroke: var(--ethical-red); animation: ringIn 1s ease forwards 0.5s; }
  .rings circle:nth-child(4) { stroke: var(--ethical-teal); animation: ringIn 1s ease forwards 0.7s; }

  @keyframes ringIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }

  .card-container {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 1px 3px rgba(60,64,67,0.08), 0 4px 8px rgba(60,64,67,0.04);
  }

  .kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--ethical-blue);
    margin: 0 0 12px;
  }

  h1 {
    font-size: 30px;
    font-weight: 500;
    line-height: 1.3;
    margin: 0 0 16px;
    color: var(--ink);
    letter-spacing: -0.3px;
  }

  .lede { font-size: 15.5px; color: var(--ink-dim); margin: 0 0 16px; line-height: 1.65; }

  .parts-list {
    list-style: none;
    padding: 0;
    margin: 24px 0 32px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .parts-list li {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .parts-list .num {
    background: rgba(42, 82, 190, 0.1);
    color: var(--ethical-blue);
    font-weight: 700;
    font-size: 13px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .parts-list .txt strong { display: block; font-size: 14px; color: var(--ink); font-weight: 600; margin-bottom: 3px; line-height: 1.3; }
  .parts-list .txt span { font-size: 12.5px; color: var(--muted); line-height: 1.45; }

  @media (max-width: 360px) {
    .parts-list { grid-template-columns: 1fr; }
  }

  button.cta {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 15px;
    background: linear-gradient(105deg, var(--ethical-blue), #3b82f6 50%, var(--ethical-red));
    color: #ffffff;
    border: none;
    padding: 12px 28px;
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    box-shadow: 0 1px 3px rgba(42,82,190,0.3);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  button.cta:hover { filter: brightness(1.1); box-shadow: 0 3px 8px rgba(42,82,190,0.25); }
  button.cta:active { transform: translateY(1px); }

  .lang-card {
    margin: 16px 0 24px;
    padding: 16px;
    background: var(--panel-2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
  }
  .lang-card p { margin: 0; color: var(--ink-dim); font-weight: 500; }
  .lang-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 8px 16px;
    border-radius: 20px;
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lang-btn:hover { border-color: var(--ethical-blue); color: var(--ethical-blue); }

  .part-label { font-size: 13px; font-weight: 600; color: var(--ethical-blue); margin: 0 0 12px; }
  .qtext {
    font-size: 22px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ink);
    margin: 0 0 28px;
  }

  .help-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--ethical-blue);
    background: var(--panel);
    color: var(--ethical-blue);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    vertical-align: middle;
    margin-left: 8px;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s ease, color 0.2s ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .help-btn:hover { background: var(--ethical-blue); color: #fff; }
  }
  .help-panel {
    display: none;
    margin: -16px 0 24px;
    padding: 16px 18px;
    background: var(--panel-2);
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.65;
    color: var(--ink-dim);
  }
  .help-panel.open { display: block; }
  .help-panel p { margin: 0 0 10px; }
  .help-panel p:last-child { margin-bottom: 0; }
  .help-panel b { color: var(--ink); }

  .options { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .opt-btn {
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    padding: 16px 20px 16px 48px;
    position: relative;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .opt-btn .letter {
    position: absolute;
    left: 16px;
    top: 16px;
    font-weight: 700;
    color: var(--ethical-yellow);
    font-size: 14px;
  }
  @media (hover: hover) and (pointer: fine) {
    .opt-btn:hover {
      border-color: var(--ethical-blue);
      background: rgba(42, 82, 190, 0.04);
      box-shadow: 0 1px 4px rgba(42, 82, 190, 0.12);
    }
    .opt-btn:hover .check-icon {
      border-color: var(--ethical-blue);
      color: var(--ethical-blue);
    }
  }

  .opt-btn.selected {
    border-color: var(--ethical-yellow);
    background: rgba(217, 119, 6, 0.08);
  }

  .opt-btn .check-icon {
    position: absolute;
    left: 14px;
    top: 14px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
    font-weight: 700;
    color: var(--muted);
    background: var(--panel);
    transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  .opt-btn .check-icon::before {
    content: '+';
    display: block;
  }
  .opt-btn.selected .check-icon {
    border-color: var(--ethical-yellow);
    background: var(--ethical-yellow);
    color: #fff;
    animation: checkPop 0.28s cubic-bezier(.34,1.56,.64,1);
  }
  .opt-btn.selected .check-icon::before {
    content: '✓';
  }
  @keyframes checkPop {
    0% { transform: scale(0.5) rotate(-20deg); opacity: 0.4; }
    60% { transform: scale(1.2) rotate(6deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .error-msg {
    color: var(--ethical-red);
    font-size: 14px;
    font-weight: 600;
    margin-top: 12px;
    display: none;
  }

  .test-progress {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: 12px 0;
    margin-bottom: 20px;
    background: var(--bg);
  }
  .test-progress-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .test-progress-track { height: 6px; width: 100%; border-radius: 3px; background: var(--line); overflow: hidden; }
  .test-progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--ethical-blue), var(--ethical-yellow), var(--ethical-red)); transition: width 0.35s ease; border-radius: 3px; }

  .accordion-container { margin: 24px 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .accordion-item { border-bottom: 1px solid var(--line); }
  .accordion-item:last-child { border-bottom: none; }
  .accordion-header {
    width: 100%;
    padding: 16px 20px;
    background: none;
    border: none;
    text-align: left;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s;
  }
  .accordion-header:hover { background: var(--panel-2); }
  .accordion-header::after { content: '+'; font-size: 18px; font-weight: 500; color: var(--ethical-yellow); }
  .accordion-item.active .accordion-header::after { content: '−'; }
  .accordion-body { padding: 0 20px 16px; display: none; font-size: 14.5px; color: var(--ink-dim); line-height: 1.65; }
  .accordion-item.active .accordion-body { display: block; }

  .moral-map-inline { 
    margin-top: 20px; 
    margin-bottom: 8px; 
    padding: 20px 16px; 
    border: 1px solid var(--line); 
    background: var(--panel-2); 
    border-radius: 12px; 
    text-align: center;
  }
  .moral-map-inline h4 { font-size: 16px; font-weight: 600; margin: 0 0 12px; color: var(--ink); }
  .moral-map-svg { display: block; width: 100%; max-width: 440px; margin: 0 auto; overflow: visible; }
  .map-label { font-size: 11px; fill: var(--muted); font-weight: 500; letter-spacing: 0.3px; }
  .map-you { font-size: 11.5px; fill: var(--ethical-yellow); font-weight: 700; letter-spacing: 0.5px; }

  .result-tag { font-size: 12px; font-weight: 700; color: var(--ethical-blue); text-transform: uppercase; margin: 0 0 8px; }
  .result-title { font-size: 26px; font-weight: 500; color: var(--ink); margin: 0 0 16px; }

  .result-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    margin: -8px 0 20px;
    padding: 14px 16px;
    background: var(--panel-2);
    border-radius: 10px;
  }
  .result-meta-item { font-size: 14px; }
  .result-meta-item .meta-label { font-weight: 700; color: var(--ethical-blue); }
  .result-meta-item .meta-value { color: var(--ink); }
  .result-oppose {
    margin: 20px 0;
    padding: 16px;
    background: rgba(220, 38, 38, 0.06);
    border-radius: 8px;
    border-left: 4px solid var(--ethical-red);
    font-size: 14px;
    color: #991b1b;
  }
  .result-oppose b { color: var(--ink); }

  .summary-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    background: var(--panel);
    box-shadow: 0 1px 2px rgba(60,64,67,0.05);
  }
  .summary-card .stage { font-size: 12px; font-weight: 700; color: var(--ethical-blue); margin: 0 0 6px; text-transform: uppercase; }
  .summary-card h3 { font-size: 20px; font-weight: 500; margin: 0 0 8px; color: var(--ink); }
  .summary-card .summary-desc { font-size: 14.5px; line-height: 1.6; color: var(--ink-dim); margin: 0; }

  .share-box {
    margin-top: 36px;
    padding: 24px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 12px;
  }
  .share-row { display: flex; gap: 10px; margin-top: 12px; }
  .share-row input { flex: 1; border: 1px solid var(--line); padding: 10px 14px; border-radius: 20px; font: inherit; color: var(--ink); }

  .restart-btn-wrap { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; }

  .credits-footer {
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 13.5px;
    color: var(--muted);
  }
  .credits-footer a {
    color: var(--ethical-blue);
    text-decoration: none;
    font-weight: 600;
  }
  .credits-footer a:hover { text-decoration: underline; }

  .privacy-note {
    margin: 20px 0;
    padding: 12px 16px;
    border-radius: 8px;
    background: var(--panel-2);
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>

function detectLang(){
  try {
    const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
    for(const l of langs){ if(l && /^pt/i.test(l)) return 'pt'; }
  } catch(e){}
  return 'en';
}

let currentLang = detectLang();

// If the URL carries a shared-result hash with an explicit language prefix
// (e.g. "#pt:rc,em,cch,aaf"), honor the sharer's language over the browser's.
(function applySharedLangOverride(){
  try {
    const raw = (typeof location !== 'undefined' && location.hash) ? location.hash.slice(1) : '';
    const m = raw.match(/^(pt|en):/);
    if(m) currentLang = m[1];
  } catch(e){}
})();

      ]},
      r_cultural:{type:'result', tag:'Ética normativa · Relativismo', title:'Relativismo cultural', body:['O que é moralmente certo ou errado depende estritamente das normas, crenças e práticas vigentes em cada cultura ou sociedade. Sob essa ótica, não existe um padrão moral universal ou externo válido para julgar culturas a partir de fora. A moralidade é vista puramente como uma construção coletiva e histórica.']},
      r_individual:{type:'result', tag:'Ética normativa · Relativismo', title:'Relativismo individual (Subjetivismo)', body:['O que é certo ou errado depende exclusivamente do julgamento, sentimento ou preferência pessoal de cada indivíduo. A moralidade é, em última instância, uma escolha inteiramente subjetiva. O que é "verdade" moral para uma pessoa pode não ser para outra, não havendo base para imposição.']},
      r_descritivo:{type:'result', tag:'Ética normativa · Relativismo', title:'Relativismo meramente descritivo', body:['Você reconhece a profunda variação sociocultural das normas como um fato empírico inegável da humanidade, mas acredita que essa diversidade de opiniões não exclui necessariamente a existência de uma verdade moral objetiva subjacente que talvez ainda estejamos tentando descobrir.']},
      r_apontar_meta:{type:'result', tag:'Isso é metaética, não teoria normativa', title:'Não-cognitivismo / Expressivismo', body:['Essa é uma posição focada na natureza da própria linguagem moral (metaética), e não uma teoria normativa primária sobre como devemos agir de fato. Ela sugere que nossos juízos morais apenas expressam atitudes. Essa visão será profundamente explorada na Parte 3 deste teste.']},

      t2:{type:'question', text:'Ao decidir se uma ação é certa ou errada, o que você considera fundamental?',
        help: '<p>Pense em um exemplo: contar uma mentira pequena para poupar os sentimentos de um amigo.</p><p>Focar no <b>resultado</b> significa perguntar: essa mentira deixa as coisas melhores ou piores no total, considerando todos os afetados?</p><p>Focar em <b>regras ou deveres</b> significa perguntar: mentir é errado em si, então não deveria fazer isso — mesmo que pareça produzir um resultado bom.</p><p>Focar no <b>caráter</b> significa perguntar: que tipo de pessoa eu sou ao mentir aqui — estou sendo gentil, ou covarde por evitar uma conversa difícil?</p><p>Focar no <b>próprio interesse</b> significa perguntar: o que é melhor para mim nessa situação, independente do efeito nos outros?</p>',
        options:[
        {label:'O resultado da escolha: se o mundo que resulta dela é melhor que as alternativas', next:'t3_ato_regra'},
        {label:'Se ela respeita certas regras, deveres ou direitos — independente do resultado', next:'t2b'},
        {label:'O tipo de pessoa que a pratica, e os traços de caráter que ela expressa', next:'t_character'},
        {label:'Se promove meu próprio interesse — porque isso é a própria definição do certo', next:'t_egoism'},
      ]},
      t2b:{type:'question', text:'Essas regras ou deveres se fundamentam em quê?', options:[
        {label:'Na vontade ou nos mandamentos de uma autoridade divina', next:'t_divine'},
        {label:'Na razão, em direitos universais, ou em princípios morais independentes de religião', next:'t_deontology'},
      ]},
      
      t_divine:{type:'question', text:'Qual dessas visões sobre a relação entre o certo e Deus descreve melhor sua posição?', options:[
        {label:'Algo é bom simplesmente porque Deus o ordena; não há padrão de bondade independente da vontade divina', next:'r_divine_a'},
        {label:'Deus ordena o que é bom porque é, por natureza, perfeitamente amoroso; a vontade divina expressa a bondade, não a cria arbitrariamente', next:'r_divine_b'},
      ]},
      r_divine_a:{type:'result', tag:'Ética normativa', title:'Teoria do Mandamento Divino (Tradicional)', body:['Uma ação é certa simplesmente porque é ordenada por Deus e errada porque é proibida por Ele. O fundamento último da moralidade reside puramente na vontade soberana divina. Isso implica que não há um padrão de bondade independente; a moral é definida estruturalmente pelo decreto de Deus.']},
      r_divine_b:{type:'result', tag:'Ética normativa', title:'Teoria do Mandamento Divino (Modificada)', body:['Deus ordena o que é bom porque sua própria essência e natureza são perfeitamente amorosas, justas e boas. A vontade divina expressa a bondade, mas não a cria de forma puramente arbitrária. Há um padrão de bem intrínseco à própria natureza imutável de Deus.']},

      t_deontology:{type:'question', text:'Qual dessas visões sobre deveres morais melhor descreve a sua?', options:[
        {label:'Certas restrições morais jamais podem ser violadas, custe o que custar', next:'r_deon_a'},
        {label:'Valem na maioria dos casos, mas cedem se as consequências forem catastróficas', next:'r_deon_b'},
        {label:'O fundamental é respeitar direitos básicos como "trunfos" contra o cálculo de resultados', next:'r_deon_c'},
        {label:'O que importa é se o dano foi pretendido intencionalmente ou só previsto como efeito colateral', next:'r_deon_d'},
        {label:'Há vários deveres (não mentir, ser justo, reparar) que podem entrar em conflito sem hierarquia fixa', next:'r_deon_e'},
      ]},
      r_deon_a:{type:'result', tag:'Ética normativa', title:'Deontologia Absolutista', body:['Certas restrições morais (como não mentir, não torturar ou não matar inocentes) são deveres categóricos que jamais podem ser violados, mesmo que quebrá-los pudesse evitar um grande desastre. O dever moral é absoluto, inegociável e independente de cálculos utilitários sobre resultados — os fins nunca justificam os meios corruptos.']},
      r_deon_b:{type:'result', tag:'Ética normativa', title:'Deontologia Moderada (de Limiar)', body:['As restrições e regras morais valem de forma estrita na imensa maioria dos casos diários e estruturam nossa vida social. No entanto, essas regras de ferro podem (e devem) ser violadas ou suspensas caso as consequências de segui-las rigidamente cruzem um limiar que se mostre flagrantemente catastrófico.']},
      r_deon_c:{type:'result', tag:'Ética normativa', title:'Deontologia de Direitos', body:['O que fundamenta e legitima suas restrições morais é o respeito inviolável a direitos morais básicos e inerentes aos indivíduos. Esses direitos funcionam como verdadeiros "trunfos" protetores que bloqueiam qualquer tentativa de sacrificar o indivíduo em nome do bem maior ou da utilidade e conveniência do coletivo.']},
      r_deon_d:{type:'result', tag:'Ética normativa', title:'Doutrina do Duplo Efeito', body:['A moralidade de uma ação frequentemente depende da intenção subjetiva por trás dela. Na sua visão, é moralmente muito diferente causar um dano intencionalmente (usando-o como um meio para um fim) do que prever racionalmente que um dano ocorrerá como um efeito colateral trágico, não intencional, de uma boa ação.']},
      r_deon_e:{type:'result', tag:'Ética normativa', title:'Deontologia Pluralista (Deveres Prima Facie)', body:['Não existe apenas um princípio moral supremo e isolado, mas sim vários deveres fundamentais (como dizer a verdade, reparar danos passados, ser justo, promover a bondade). Quando esses deveres entram em conflito na vida real, não há um fluxograma rígido a seguir: cabe ao julgamento prático (sabedoria) discernir qual dever possui maior peso no contexto específico.']},

      t_character:{type:'question', text:'Ao focar na pessoa que age, o que você considera mais fundamental?', options:[
        {label:'Cultivar virtudes (coragem, justiça, compaixão) valiosas em si mesmas', next:'r_char_a'},
        {label:'Cultivar a disposição de cuidar de relações e dos mais vulneráveis', next:'r_char_b'},
      ]},
      r_char_a:{type:'result', tag:'Ética normativa', title:'Ética das Virtudes', body:['O centro da vida moral não está na aplicação mecânica de regras restritivas ou no cálculo frio de consequências futuras, mas no esforço contínuo e orgânico para cultivar um caráter virtuoso (englobando traços como coragem, compaixão, sabedoria prática e justiça). O foco principal se volta para a pergunta formativa: "que tipo de pessoa eu devo me tornar para florescer?"']},
      r_char_b:{type:'result', tag:'Ética normativa', title:'Ética do Cuidado', body:['O traço moral fundamental e mais valioso a se cultivar é a disposição genuína e atenta de cuidar daqueles que dependem de nós nas tramas da vida. A ética do cuidado rejeita abstrações excessivas e direciona a atenção empática para as relações interpessoais concretas, priorizando a vulnerabilidade, os laços afetivos e as necessidades reais imediatas.']},

      t_egoism:{type:'question', text:'Qual versão sobre agir em interesse próprio descreve sua posição?', options:[
        {label:'Toda pessoa deveria agir sempre em seu próprio interesse; essa é a regra para todos', next:'r_ego_a'},
        {label:'Eu devo agir no meu próprio interesse; não estou prescrevendo isso para os outros', next:'r_ego_b'},
      ]},
      r_ego_a:{type:'result', tag:'Ética normativa', title:'Egoísmo Ético Universal', body:['Todo agente moral tem a estrita obrigação ética de agir constantemente buscando maximizar o seu próprio interesse pessoal a longo prazo. Esta visão postula que essa não é apenas uma preferência tática e prática, mas a lei universal correta que você prescreve normativa e dogmaticamente para todas as outras pessoas.']},
      r_ego_b:{type:'result', tag:'Ética normativa', title:'Egoísmo Ético Individual', body:['Você adota internamente como princípio diretor de vida agir de forma fundamental em prol da maximização do seu próprio interesse e felicidade, mas encara isso essencialmente como uma escolha estratégica e individual. Você é cauteloso ou neutro em prescrever ou exigir universalmente que o resto da sociedade opere com esse mesmo tipo de egoísmo dogmático.']},

      t3_ato_regra:{type:'question', text:'Para você, a análise das consequências deve ser feita avaliando cada ação individualmente, avaliando regras gerais, ou combinando ambos?',
        help: '<p>Pense em um exemplo: decidir se está certo quebrar uma promessa quando, só dessa vez, isso parece trazer um resultado melhor.</p><p>Avaliar <b>caso a caso</b> significa julgar essa situação específica pelo resultado que ela produz agora, sem se prender a um padrão geral.</p><p>Avaliar por <b>regra geral</b> significa perguntar: se todo mundo pudesse quebrar promessas nessas condições, o resultado geral seria bom? Se não, você mantém a promessa mesmo aqui.</p><p>O caminho <b>híbrido</b> significa seguir a regra geral na maioria das vezes, mas abrir uma exceção em situações realmente extremas.</p>',
        options:[
        {label:'Ato a ato — importa o resultado da ação específica disponível no momento', next:'t_conseq', set:{key:'actRule', value:'Consequencialismo de Atos'}},
        {label:'Regras gerais — importa qual regra, se seguida por todos, geraria o melhor resultado', next:'t_conseq', set:{key:'actRule', value:'Consequencialismo de Regras'}},
        {label:'Dois níveis — regras gerais na prática diária, mas cálculo focado no ato para reflexão e situações críticas', next:'t_conseq', set:{key:'actRule', value:'Consequencialismo de Dois Níveis'}}
      ]},

      t_conseq:{
        type:'multi_select',
        text:'Como você avalia quais consequências são as "melhores" e devem ser priorizadas? (Selecione todas que aplicar)',
        help: '<p>Pense em um exemplo: distribuir um recurso limitado (como vacinas, ou um bônus de fim de ano) entre um grupo de pessoas.</p><p><b>Maior soma total:</b> distribuir de forma a gerar o maior benefício total somado, não importa como fica dividido.</p><p><b>Peso extra para quem está pior:</b> dar prioridade a quem está em situação mais vulnerável, mesmo que isso não maximize o total.</p><p><b>Só o pior caso importa:</b> julgar a distribuição unicamente pelo quanto ela melhora a vida de quem está na pior situação.</p><p><b>Igualdade importa:</b> se importar com o quão parecida é a distribuição entre as pessoas, não só com o total.</p><p><b>Mínimo garantido:</b> garantir que todos atinjam um patamar básico suficiente, mesmo que sobre menos para otimizar o restante.</p><p><b>Maior média:</b> maximizar quanto cada pessoa recebe em média, mesmo que o total geral acabe sendo menor.</p>',
        noneOption:'Nenhuma destas opções descreve minha visão',
        options:[
          {label:'A maior soma total de bem-estar acumulado', val:'Utilitarismo Clássico'},
          {label:'A soma total, mas dando peso prioritário aos indivíduos que estão em pior situação', val:'Prioritarismo'},
          {label:'Avalio apenas pelo nível de quem está na pior situação possível', val:'Maximin'},
          {label:'O que mais importa é o grau de igualdade na distribuição', val:'Igualitarismo'},
          {label:'Garantir que todos atinjam um nível mínimo e suficiente de bem-estar', val:'Suficientismo'},
          {label:'A maior média de bem-estar por indivíduo', val:'Utilitarismo Médio'}
        ],
        nextIfSelected:'t_conseq_neg',
        nextIfNone:'t_conseq_neg'
      },

      t_conseq_neg:{type:'question', text:'E sobre o peso do sofrimento em relação ao prazer ou bem-estar positivo?',
        help: '<p>Pense em um exemplo para diferenciar as duas últimas opções: escolher entre (1) evitar uma dor pequena em alguém, ou (2) gerar uma quantidade enorme de prazer puro para muitas pessoas, sem nenhum sofrimento envolvido.</p><p>Na opção <b>C</b>, o prazer ainda conta normalmente nesse caso — como não há sofrimento extremo em jogo, você compararia as duas opções normalmente, e a quantidade enorme de prazer provavelmente venceria. A prioridade absoluta ao sofrimento só entra quando o sofrimento em questão é extremo.</p><p>Na opção <b>D</b>, o prazer não pesa nada na balança, nunca — nem nesse caso comum. Evitar mesmo uma dor pequena viria antes de qualquer quantidade de prazer, por maior que fosse, porque o prazer simplesmente não conta como razão moral.</p>',
        options:[
        {label:'Sofrimento e prazer devem ser considerados de forma simétrica no cálculo', next:'t_conseq_result', set:{key:'negChoice', value:'Visão Simétrica'}},
        {label:'O sofrimento tem um peso maior que o prazer, mas pode ser compensado por grandes quantidades de bem-estar', next:'t_conseq_result', set:{key:'negChoice', value:'Prioridade ao Sofrimento'}},
        {label:'O sofrimento tem prioridade absoluta apenas em casos extremos: nenhuma quantidade de prazer compensa sofrimento extremo, mas fora desses casos o prazer ainda conta normalmente', next:'t_conseq_result', set:{key:'negChoice', value:'Prioridade Absoluta'}},
        {label:'O prazer nunca tem valor moral positivo, nem mesmo fora de casos extremos: só a redução do sofrimento conta como razão moral, sempre', next:'t_conseq_result', set:{key:'negChoice', value:'Foco Exclusivo no Sofrimento'}},
      ]},

      t_conseq_result:{type:'dynamicResult', tag:'Ética normativa · Consequencialismo', render: function(a){
        const aggs = a.t_conseq_selections || [];
        const negChoice = a.negChoice || 'Visão Simétrica';
        const actRule = a.actRule || 'Consequencialismo de Atos';

        const ismDescs = {
          'Utilitarismo Clássico': 'busca a maior soma total de bem-estar, somando os interesses de todos',
          'Prioritarismo': 'dá peso extra ao bem-estar de quem está em pior situação',
          'Maximin': 'avalia uma escolha apenas pelo nível de quem estará na pior situação possível',
          'Igualitarismo': 'valoriza a igualdade na distribuição do bem-estar, não só o total acumulado',
          'Suficientismo': 'garante que todos atinjam um patamar mínimo suficiente de bem-estar',
          'Utilitarismo Médio': 'busca a maior média de bem-estar por pessoa, não a soma total'
        };
        const selectedIsms = aggs.filter(x => ismDescs[x]);
        const subcorrentes = selectedIsms.length > 0
          ? selectedIsms.join(', ')
          : 'Nenhuma específica (soma simples de bem-estar)';
        const subcorrentesExplain = selectedIsms.length > 0
          ? selectedIsms.map(s => s + ' (' + ismDescs[s] + ')').join('; ')
          : 'você não indicou um critério específico de agregação — na prática, isso equivale a somar o bem-estar de todos sem regras adicionais';

        const focusMap = {
          'Foco Exclusivo no Sofrimento': 'Exclusivamente negativo',
          'Prioridade Absoluta': 'Negativo (prioridade absoluta ao sofrimento)',
          'Prioridade ao Sofrimento': 'Prioridade ao sofrimento',
          'Visão Simétrica': 'Simétrico'
        };
        const focusDescMap = {
          'Foco Exclusivo no Sofrimento': 'o prazer nunca tem valor moral positivo, nem mesmo fora de casos extremos — só a redução do sofrimento conta como razão moral, sempre',
          'Prioridade Absoluta': 'nenhuma quantidade de prazer pode compensar sofrimento extremo — mas fora desses casos extremos, o prazer ainda conta normalmente',
          'Prioridade ao Sofrimento': 'o sofrimento pesa mais do que o prazer equivalente, mas ainda pode ser compensado por bastante bem-estar',
          'Visão Simétrica': 'sofrimento e prazer entram no cálculo moral com o mesmo peso'
        };

        const methodMap = {
          'Consequencialismo de Atos': 'Por Atos',
          'Consequencialismo de Regras': 'Por Regras',
          'Consequencialismo de Dois Níveis': 'Híbrido (Dois Níveis)'
        };
        const methodDescMap = {
          'Consequencialismo de Atos': 'avaliando cada ação individualmente pelo resultado que ela produz',
          'Consequencialismo de Regras': 'seguindo a regra geral que, se adotada por todos, produziria o melhor resultado',
          'Consequencialismo de Dois Níveis': 'seguindo regras gerais no dia a dia, mas recorrendo ao cálculo direto do ato em situações extremas ou de reflexão'
        };

        const bodyText = `Você julga o valor moral de uma escolha pelo resultado que ela produz, ${methodDescMap[actRule] || methodDescMap['Consequencialismo de Atos']}. Dentro disso: ${subcorrentesExplain}. Quanto ao peso do sofrimento frente ao prazer, sua posição é que ${focusDescMap[negChoice] || focusDescMap['Visão Simétrica']}.`;

        return {
          title: 'Consequencialismo',
          meta: [
            { label: 'Método', value: methodMap[actRule] || actRule },
            { label: 'Subcorrentes', value: subcorrentes },
            { label: 'Enfoque', value: focusMap[negChoice] || focusMap['Visão Simétrica'] }
          ],
          body: [ bodyText ]
        };
      }}
    }
  },

      r_c1_tribal:{type:'result', level:2, tag:'Círculo moral', title:'Tribalismo Familiar', body:['Essa é uma postura parcial que dá ênfase àquilo que é familiar — família de sangue e amigos, por exemplo. Sua bússola moral rejeita a imparcialidade radical, argumentando que as conexões interpessoais têm profundo peso ético e legitimando a priorização daqueles que fazem parte do seu círculo afetivo direto e familiar.'], oppose:'Altruísmo Imparcial / Universalismo'},

              { title: 'Por que diversos filósofos defendem que o círculo moral deve ser expandido?', text: 'Por razões essenciais de coerência lógica e universalidade ética. Filósofos defendem que o círculo moral deve ser expandido ativamente porque a consistência lógica, a imparcialidade e a universalidade exigem que tratemos casos fundamentalmente semelhantes (como a mera capacidade de sofrer de forma consciente) de maneira semelhante. Isso impede que preconceitos arbitrários — biológicos, geográficos ou culturais — limitem nossa empatia, criando uma base moral sólida e intersubjetiva que potencializa fortemente a cooperação pacífica global.' }

      c4:{
        type:'multi_select',
        text:'Quais destes seres, grupos ou entidades recebem consideração moral direta da sua parte? (Selecione todos que se aplicam)',
        help: '<p><b>Humanos</b> e <b>Animais sencientes</b> não podem ser marcados juntos, porque a segunda opção já inclui todos os humanos — marque só uma delas, e combine com as demais se quiser.</p><p>Marcar <b>Animais sencientes</b> abre duas perguntas extras sobre se a inteligência muda o peso do sofrimento, e se o futuro importa tanto quanto o presente.</p><p><b>Toda vida orgânica</b> inclui plantas e outros seres vivos sem sistema nervoso. <b>Ecossistemas</b> trata a natureza como um sistema, e não como indivíduos.</p><p>Por exemplo: um mosquito sente dor? Se você acha que sim, ele entra em "animais sencientes". Já uma floresta antiga, mesmo sem "sentir" nada, pode ainda importar moralmente como um todo — é isso que a opção "ecossistemas" tenta capturar.</p>',
        noneOption:'Nenhum destes',
        options:[

      c4_gradualism:{type:'question', text:'Dentro do grupo de seres sencientes, a inteligência ou complexidade cognitiva deve alterar o peso dado ao sofrimento?', options:[
        {label:'Sim — dor em seres com maior capacidade cognitiva importa mais', next:'c4_temporal', set:{key:'circleGradual', value:'gradualist'}},

        {label:'Não — o bem-estar de seres contemporâneos pesa mais do que os do futuro', next:'r_c4_multi', set:{key:'circleTemporal', value:'temporalist'}},

      r_c4_multi:{
        type:'dynamicResult',
        tag:'Círculo moral',
        render: function(a){
          const sels = a.c4_selections || [];
          let level = 4;
          let conflito = false;
          let title = '';
          let desc = '';

          const hasHum = sels.includes('Humanos');
          const hasSen = sels.includes('Animais Sencientes');
          const hasBio = sels.includes('Toda Vida Orgânica');
          const hasEco = sels.includes('Ecossistemas');
          const hasDig = sels.includes('IAs e Robôs Sencientes');

          if (hasSen) {
             const grad = a.circleGradual;
             const temp = a.circleTemporal;
             const ecoNote = hasEco ? ' Você também atribui grande valor ao equilíbrio dos ecossistemas como um todo, combinando essa visão com uma preocupação ecológica sistêmica.' : '';
             const ecoSuffix = hasEco ? ' e Holismo Ecológico' : '';
             level = hasDig ? 6 : 5;

             if (hasDig) {
               if (grad === 'gradualist' && temp === 'temporalist') {
                  title = 'Sencientismo Parcial (Gradualista Temporalista)';
                  desc = 'Sua consideração moral se estende a todos os seres capazes de sofrer ou sentir bem-estar, biológicos ou digitais, mas com duas restrições: seres com maior capacidade cognitiva recebem mais peso moral do que os demais, e o bem-estar de quem existe agora pesa mais do que o de seres sencientes que ainda vão existir no futuro.' + ecoNote;
               } else if (grad === 'gradualist' && temp === 'atemporal') {
                  title = 'Sencientismo Parcial (Gradualista Atemporal)';
                  desc = 'Sua consideração moral se estende a todos os seres capazes de sofrer ou sentir bem-estar, biológicos ou digitais, ponderando o sofrimento pela complexidade cognitiva de cada ser — mas, diferentemente de uma visão apenas presentista, seres sencientes do futuro distante merecem para você o mesmo peso moral que os de hoje.' + ecoNote;
               } else if (grad === 'nongradualist' && temp === 'temporalist') {
                  title = 'Sencientismo Parcial (Pleno Temporalista)';
                  desc = 'Sua consideração moral trata interesses semelhantes de forma igual, independentemente da inteligência ou espécie do ser — seres biológicos e digitais recebem o mesmo peso quando seus interesses são equivalentes. No entanto, você dá prioridade ao bem-estar de quem já existe hoje em relação ao de seres sencientes que só existirão no futuro.' + ecoNote;
               } else {
                  title = 'Sencientismo Pleno' + ecoSuffix;
                  desc = 'Até onde se sabe, esse é o raio mais expansivo de consideração moral pautado na experiência: a senciência plena. Para essa visão, o que importa eticamente não é a raça, nação, sexo, ou mesmo o substrato biológico de um ser, mas puramente o fato de ele possuir a capacidade subjetiva de sofrer e sentir bem-estar. Interesses semelhantes, como o desejo de evitar a dor, recebem o mesmo peso moral, rejeitando a ideia de que possuir maior inteligência ou pertencer a uma espécie específica torne o sofrimento de um indivíduo mais importante. Além disso, essa consideração se estende através do tempo: os seres sencientes que existirão no futuro distante merecem a mesma consideração moral que os que existem no presente.' + ecoNote;
               }
             } else {
               const carbonNote = ' Sua visão traça o limite do seu núcleo de empatia na biologia orgânica, sem reconhecer (por ora) a possibilidade de mentes dignas de consideração em substratos digitais.';
               if (grad === 'gradualist' && temp === 'temporalist') {
                  title = 'Sencientismo Parcial (Carbonismo Gradualista Temporalista)';
                  desc = 'Sua consideração moral se estende a todos os animais sencientes, mas com duas restrições: seres com maior capacidade cognitiva recebem mais peso moral do que os demais, e o bem-estar de quem existe agora pesa mais do que o de seres sencientes que ainda vão existir no futuro.' + carbonNote + ecoNote;
               } else if (grad === 'gradualist' && temp === 'atemporal') {
                  title = 'Sencientismo Parcial (Carbonismo Gradualista Atemporal)';
                  desc = 'Sua consideração moral se estende a todos os animais sencientes, ponderando o sofrimento pela complexidade cognitiva de cada ser — mas, diferentemente de uma visão apenas presentista, animais sencientes do futuro distante merecem para você o mesmo peso moral que os de hoje.' + carbonNote + ecoNote;
               } else if (grad === 'nongradualist' && temp === 'temporalist') {
                  title = 'Sencientismo Parcial (Carbonismo Pleno Temporalista)';
                  desc = 'Sua consideração moral trata interesses semelhantes de forma igual entre os animais sencientes, independentemente de quão inteligente o ser seja. No entanto, você dá prioridade ao bem-estar de quem já existe hoje em relação ao de seres sencientes que só existirão no futuro.' + carbonNote + ecoNote;
               } else {
                  title = 'Sencientismo Pleno (Carbonismo)' + ecoSuffix;
                  desc = 'Dentro da vida biológica, esse é o raio mais expansivo de consideração moral pautado na experiência: você trata o sofrimento de todo animal senciente com o mesmo peso, independente de espécie ou nível de inteligência, e estende essa consideração igualmente a animais sencientes que só existirão no futuro.' + carbonNote + ecoNote;
               }
             }
          } else if (hasHum && hasBio) {
             title = 'Antropocentrismo Biocêntrico';
             desc = 'Sua visão valoriza primariamente os interesses dos seres humanos e estende alguma consideração à vida orgânica em geral, mas revela uma lacuna ética significativa: ao não marcar "animais sencientes", você deixa de fora, de forma direta e igualitária, os animais não-humanos capazes de sofrer — os próprios sujeitos de bem-estar dentro da vida biológica que você já valoriza.';
             level = 4;
          } else if (hasBio) {
             title = 'Biocentrismo';
             desc = 'Você sustenta que toda forma de vida biológica importa moralmente e possui valor intrínseco, independentemente de possuir um sistema nervoso ou a capacidade subjetiva de sentir dor ou prazer — o que inclui plantas, fungos e micro-organismos dentro do seu círculo de consideração.';
             level = 4;
          } else if (hasHum && hasEco) {
             title = 'Antropocentrismo com Preocupação Ecológica';
             desc = 'Você concentra sua consideração moral direta na espécie humana, mas também atribui valor ao equilíbrio dos ecossistemas como um todo — uma combinação que pode gerar tensão, já que não reconhece diretamente a senciência dos animais não-humanos que compõem esses próprios ecossistemas.';
             level = 4;
          } else if (hasEco) {
             title = 'Ecocentrismo / Holismo Ambiental';
             desc = 'O valor moral primário reside, na sua visão, no equilíbrio da rede ecológica como um todo. Você concebe a natureza como um sistema interdependente, podendo priorizar a saúde estrutural desse sistema sobre a vida de organismos individuais.';
             level = 4;
          } else if (hasHum) {
             title = 'Antropocentrismo Exclusivo';
             level = 3;
             desc = 'Sua consideração ética central se restringe à espécie humana. Os demais animais e o meio ambiente são vistos primariamente sob um enfoque instrumental, recebendo no máximo consideração indireta, derivada do interesse que representam para as sociedades humanas.';
          } else if (sels.length === 0) {
             title = 'Nenhuma Consideração Moral Direta Atribuída';
             level = 2;
             desc = 'Você não atribuiu consideração moral direta a nenhuma das categorias listadas. Isso pode refletir ceticismo sobre a própria ideia de "consideração moral", ou apenas que nenhuma opção capturou bem sua visão — vale revisitar essa pergunta com calma.';
          } else {
             title = 'Pluralismo Moral Atípico';
             level = 4;
             desc = 'Sua consideração ética combina categorias de um modo pouco comum. Você marcou: ' + sels.join(', ') + '.';
          }

          if (hasEco && !hasSen) {
            conflito = true;
          }

          let text = desc;

          if (conflito) {
            text += ' Atenção: há uma tensão em sua posição. Ao dar valor ao ecossistema como um todo sem incluir a senciência (animal ou humana) entre suas prioridades, sua teoria pode, em situações extremas, justificar sacrificar indivíduos sensíveis e inocentes em nome do equilíbrio do sistema. Vale refletir sobre qual desses valores deve prevalecer em caso de conflito real.';
          }

          return {
            title: title,
            level: level,
            body: [text]
          };
        }
      }
    }
  },
  {
    key:'meta', label:'Parte 3 · Fundamentos metaéticos', root:'m1',
    nodes:{
      m1:{type:'question', text:'Existem fatos morais objetivos que seriam verdadeiros independentemente do que qualquer pessoa ou cultura acredite?',
        help: '<p>Pense na afirmação "torturar uma criança por diversão é errado" e nas três formas de encarar isso:</p><p><b>Sim:</b> essa afirmação é verdadeira não importa o que ninguém pense — como "a Terra gira em torno do Sol". Mesmo se todo mundo discordasse, continuaria sendo verdade.</p><p><b>Não, mas relativa a um referencial:</b> a afirmação pode ser verdadeira ou falsa, mas só dentro de um padrão específico — como dizer que uma piada é engraçada. Não existe um padrão universal, mas ainda faz sentido falar em "certo" e "errado" dentro de cada referencial.</p><p><b>Não, nem chega a ser verdadeira ou falsa:</b> a afirmação não descreve fato nenhum — dizer isso seria parecido com fazer uma careta de nojo ou vaiar algo. Expressa uma reação, não uma alegação que possa ser verdadeira ou falsa.</p>',
        options:[
        {label:'Sim', next:'m2'},
        {label:'Não, mas as afirmações morais ainda podem ser verdadeiras ou falsas dentro de algum referencial', next:'m3'},
        {label:'Não, afirmações morais nem chegam a ser verdadeiras ou falsas — são apenas expressões de atitude', next:'m_noncog'}
      ]},

      m2:{type:'question', text:'Esses fatos morais objetivos podem ser reduzidos a fatos naturais (físicos, biológicos, como o bem-estar empírico) ou eles são de uma dimensão própria, irreduzível (sui generis)?',
        help: '<p>Pense em um exemplo fora da moral: a cor vermelha. Ela é só um conjunto de propriedades físicas (um certo comprimento de onda de luz), ou é algo a mais que a física sozinha não capta?</p><p>Uma resposta possível: os fatos morais são, no fundo, fatos naturais — como bem-estar, dor ou florescimento — que a ciência poderia, em princípio, investigar, do mesmo jeito que investiga qualquer outro fenômeno.</p><p>A outra resposta possível: os fatos morais existem, mas são de um tipo de fato totalmente diferente — não são físicos nem biológicos, mesmo que estejam de alguma forma ligados a eles.</p>',
        options:[
        {label:'Eles podem ser reduzidos a fatos naturais perfeitamente investigáveis', next:'m2_epi', set:{key:'m_ontologia', value:'Naturalista'}},
        {label:'Eles não são físicos/naturais, mas são fatos de uma dimensão própria (sui generis)', next:'m2_epi', set:{key:'m_ontologia', value:'Não-Naturalista'}},
      ]},
      
      m2_epi:{type:'question', text:'Sendo objetivos, como podemos descobrir quais são os fatos morais corretos ou o critério fundamental para a moralidade?',
        help: '<p>Pense na diferença entre <b>descobrir</b> e <b>construir</b> algo. Descobrir uma verdade moral seria como um cientista descobrindo uma lei da natureza, observando o mundo. Construir uma verdade moral seria mais como um grupo de pessoas desenhando as regras justas de um jogo, perguntando o que todos aceitariam como razoável.</p><p>Uma resposta possível: descobrimos os fatos morais investigando o mundo empiricamente ou usando a intuição, do mesmo jeito que a ciência descobre outros fatos.</p><p>A outra resposta possível: chegamos às regras corretas avaliando o que pessoas racionais e imparciais decidiriam de comum acordo, sob certas condições.</p>',
        options:[
        {label:'Investigando as verdades do mundo empírica ou intuitivamente', next:'r_realismo_m2'},
        {label:'Avaliando o que agentes perfeitamente racionais decidiriam em condições ideais', next:'t_contract'}
      ]},

      r_realismo_m2:{type:'dynamicResult', tag:'Metaética', render: function(a){
        const tipo = a.m_ontologia || 'Naturalista';
        const isNat = tipo === 'Naturalista';
        const body = isNat
          ? 'A verdade moral é um fato objetivo, mas reduzível a fatos naturais — como estados de bem-estar, dor, ou florescimento biológico e psicológico. Descobrimos essas verdades investigando o mundo empiricamente, da mesma forma como a ciência descobre outros fatos naturais complexos.'
          : 'A verdade moral é um fato objetivo, mas de uma natureza própria e irredutível (sui generis) — ela não pode ser reduzida a propriedades físicas ou naturais, mesmo podendo depender delas. Descobrimos essas verdades por meio de uma faculdade especial de intuição racional, e não por observação empírica direta como nas ciências naturais.';
        return {
            title: 'Realismo Moral ' + tipo,
            body: [body]
        };
      }},

      t_contract:{
        type:'multi_select',
        text:'Você está usando a racionalidade como um critério para descobrir as regras morais corretas — imaginando o que pessoas racionais decidiriam sob certas condições. Quais dessas ideias fazem sentido para você? Pode escolher mais de uma.',
        help: '<p>Pense em um exemplo: um grupo de estranhos precisa concordar com regras para conviver, sem que ninguém saiba de antemão qual papel vai ocupar no grupo.</p><p>Uma ideia: as regras corretas são as que pessoas tentando escapar do conflito e viver em segurança aceitariam seguir.</p><p>Outra ideia: as regras corretas são as que você escolheria sem saber, de antemão, qual posição vai ocupar na sociedade — rico ou pobre, maioria ou minoria (imagine desenhar as regras sem saber onde você mesmo vai "cair" nelas).</p><p>Outra ideia: uma regra só vale se ninguém, agindo de boa-fé, pudesse recusá-la com uma razão de peso.</p><p>Outra ideia: esse mesmo exercício deveria esconder até a espécie a que você pertence — você poderia acordar sendo um animal não-humano afetado por essas regras.</p>',
        options:[
          {label:'Regras justas são as que pessoas em busca de paz e segurança mútua topariam seguir', val:'Hobbesiano'},
          {label:'Regras justas são as que escolheríamos por trás de um "véu da ignorância" — ou seja, imagine decidir as regras da sociedade sem saber, de antemão, qual posição você vai ocupar nela (rico ou pobre, maioria ou minoria)', val:'Rawlsiano'},
          {label:'Uma regra só é válida se ninguém, agindo de boa-fé, pudesse recusá-la com uma razão de peso', val:'Escanloniano'},
          {label:'Esse "véu da ignorância" deveria esconder também a espécie a que pertencemos, não só nossa posição social', val:'Estendido'}
        ],
        nextIfSelected:'r_contract_multi',
        nextIfNone:'r_contract_multi'
      },
      r_contract_multi:{
        type:'dynamicResult',
        tag:'Metaética',
        render: function(a){
          const sels = a.t_contract_selections || [];
          if(sels.length === 0){
            return {
              title:'Construtivismo Contratualista',
              body:['Você usa a racionalidade como critério para descobrir as regras morais corretas, mesmo sem se identificar com nenhuma formulação específica do contrato social listada.']
            };
          }
          const title = 'Construtivismo Contratualista (' + sels.join(' + ') + ')';
          const descMap = {
            'Hobbesiano': 'as regras corretas são os acordos pragmáticos que pessoas racionais, buscando escapar do conflito, aceitariam seguir para viver em paz',
            'Rawlsiano': 'as regras corretas são as que escolheríamos por trás de um véu da ignorância sobre nossa própria posição social',
            'Escanloniano': 'uma regra só é válida se ninguém, agindo de boa-fé, pudesse recusá-la com uma razão de peso',
            'Estendido': 'esse véu da ignorância também deveria esconder a espécie a que pertencemos — por isso, o especismo não passaria no teste da imparcialidade, já que na prática só é defendido porque sabemos de antemão que somos humanos, que não seremos as vítimas desse arranjo e que colheremos seus benefícios'
          };
          const body = 'Você usa a racionalidade como critério para descobrir as regras morais corretas. Na sua visão: ' + sels.map(s => descMap[s]).join('; e ') + '.';
          return { title: title, body: [body] };
        }
      },

      m3:{type:'question', text:'Sendo a moralidade relativa a um referencial, qual é a natureza desse referencial?',
        help: '<p>Pense na diferença entre duas situações: dizer que "comida picante é boa" (o que pode ser verdade para uma pessoa e falso para outra, sem que nenhuma esteja "errada") e dizer que "existe um círculo quadrado" (o que é simplesmente falso, sempre, para todo mundo).</p><p>Uma resposta possível: afirmações morais podem ser verdadeiras, mas só em relação a uma cultura ou pessoa específica — como o gosto por comida picante.</p><p>A outra resposta possível: afirmações morais tentam descrever algo universal, mas todas elas são simplesmente falsas, porque esse "algo" não existe — como o círculo quadrado.</p>',
        options:[
        {label:'A verdade de uma afirmação moral depende das normas da cultura que a enuncia', next:'r_mrelat'},
        {label:'Toda afirmação moral tenta ser objetiva, mas todas são falsas, pois esses fatos não existem no mundo', next:'r_error'}
      ]},
      r_mrelat:{type:'result', tag:'Metaética', title:'Relativismo / Subjetivismo Metaético', body:['Não há uma verdade moral superior e universal. Os juízos morais só são verdadeiros ou falsos em relação a uma matriz cultural ou pessoal específica — não existe um ponto de vista externo a essas matrizes a partir do qual comparar ou julgar qual delas está certa.']},
      r_error:{type:'result', tag:'Metaética', title:'Teoria do Erro (Ceticismo Moral)', body:['Sua visão reflete um ceticismo moral profundo. Toda afirmação moral (como "isso é errado") pressupõe a existência de fatos morais objetivos no universo — mas esses fatos simplesmente não existem. Por isso, todo julgamento moral já feito é, estritamente falando, falso, não porque nossa razão falhe em encontrá-los, mas porque não há nada desse tipo para ser encontrado.']},

      m_noncog:{type:'question', text:'Se a moralidade não lida com verdades e falsidades, o que fazemos quando julgamos algo como moralmente errado?', options:[
        {label:'Estamos expressando emoções (como um "Buuu!" afetivo)', next:'r_emotivismo'},
        {label:'Estamos dando comandos universalizáveis (como um "Não faça isso!")', next:'r_prescritivismo'},
        {label:'Expressamos atitudes, mas agimos e falamos como se houvesse objetividade e rigor lógico nisso', next:'r_quaserealismo'}
      ]},
      r_emotivismo:{type:'result', tag:'Metaética', title:'Emotivismo (Não-Cognitivismo)', body:['Afirmações morais não descrevem fatos: elas expressam emoções e reações afetivas. Dizer "matar é errado" equivale, em essência, a exclamar "matar, buuu!" — uma expressão de desaprovação, e não uma sentença que possa ser verdadeira ou falsa.']},
      r_prescritivismo:{type:'result', tag:'Metaética', title:'Prescritivismo', body:['Ao fazer um juízo moral, você não está descrevendo um fato do mundo, mas prescrevendo uma regra universalizável — um comando disfarçado. Dizer "matar é errado" equivale, na prática, a ordenar "não mate, e ninguém deve matar, nessas mesmas circunstâncias".']},
      r_quaserealismo:{type:'result', tag:'Metaética', title:'Quase-Realismo', body:['A moralidade nasce de atitudes e reações afetivas humanas, não de fatos externos ao mundo. Mas, ao longo da história, o debate moral estruturou essas atitudes com tanto rigor lógico, coerência e universalidade que a nossa prática ética passou a operar "como se" fatos morais objetivos realmente existissem — mesmo sem precisarmos postular entidades metafísicas para isso.']}
    }
  },
  {
    key:'openness', label:'Parte 4 · Abertura moral e intelectual', root:'o1',
    nodes:{
      o1:{type:'question', text:'Quando você encontra argumentos fortes e novas evidências que entram em conflito com uma crença moral sua, quão disposto está a mudar de ideia?', options:[
        {label:'Muito disposto — se as razões forem melhores, devo revisar minha posição', next:'o2', set:{key:'o1Score', value:3}},
        {label:'Moderadamente disposto — levo em consideração, mas exijo muitas evidências para mudar', next:'o2', set:{key:'o2Score', value:2}},
        {label:'Pouco disposto — minhas convicções morais costumam se manter firmes', next:'o2', set:{key:'o1Score', value:1}}
      ]},
      o2:{type:'question', text:'Qual atitude descreve melhor o seu nível de ceticismo frente a ideias inovadoras ou de confiança frente a ideias estabelecidas?', options:[
        {label:'Ceticismo equilibrado — questiono o que é novo e o que está estabelecido, aceitando ambos pela força lógica', next:'o3', set:{key:'o2Score', value:3}},
        {label:'Ceticismo forte às novidades — mantenho baixíssima confiança em inovação moral até ter certeza absoluta', next:'o3', set:{key:'o2Score', value:2}},
        {label:'Confiança profunda nas tradições — as ideias e intuições que sempre guiaram a sociedade são a melhor bússola', next:'o3', set:{key:'o2Score', value:1}}

      o3:{type:'question', text:'Ao avaliar uma controvérsia ética complexa, qual sua postura prática?', options:[
        {label:'Pensamento crítico sistemático — busco a melhor versão do argumento oponente', next:'r_openness', set:{key:'o3Score', value:3}},
        {label:'Equilíbrio prático — faço verificações, mas não mergulho intensamente na lógica', next:'r_openness', set:{key:'o3Score', value:2}},
        {label:'Intuição primeiro — confio no que parece moralmente certo à primeira vista', next:'r_openness', set:{key:'o3Score', value:1}}
      ]},
      r_openness:{type:'dynamicResult', tag:'Abertura Intelectual', render: function(a){

        if(res === 'alta'){

            title:'Alta Abertura e Flexibilidade Ética',
            body:[
              'Você demonstra um alto nível de pensamento crítico e uma disposição genuína para questionar suas próprias crenças mais arraigadas quando confrontado com bons contra-argumentos ou evidências sólidas. Sua bússola moral valoriza a consistência lógica acima do simples conforto de manter tradições e intuições não examinadas.'
            ]
          };
        } else if(res === 'moderada'){
          return {
            title:'Abertura Moderada',
            body:[
              'Você demonstra flexibilidade intelectual, mas adota uma postura cautelosa: para de fato mudar uma crença moral estabelecida, você exige que os novos argumentos ou evidências apresentados sejam excepcionalmente fortes e consistentes, funcionando como uma barreira prudente contra mudanças precipitadas.'

        } else {

function esc(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function slugify(str){
  if(!str) return '';
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/(^-+|-+$)/g,'');
}

function deslugify(str){
  if(!str) return '';
  return str.replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}

function shortCode(title){
  const full = slugify(title);
  if(full.length <= 20) return full;
  const stop = new Set(['e','de','da','do','das','dos','com','a','o','no','na','nos','nas','para','ou','ao','à','um','uma','the','and','with','of','to','in','on','for','a']);
  const words = title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  const sig = words.filter(w => !stop.has(w));
  const source = sig.length ? sig : words;
  const acronym = source.map(w => w[0]).join('');
  return acronym || full.slice(0, 20);
}

function buildShareUrl(){
  const parts = partResults.map(r => {
    const code = RESULT_CODE_MAP[r.title] || shortCode(r.title);
    const desc = encodeURIComponent(r.desc || '');
    const meta = r.meta && r.meta.length > 0 ? encodeURIComponent(JSON.stringify(r.meta)) : '';
    return code + '|' + desc + '|' + meta;
  });
  return location.origin + location.pathname + '#' + currentLang + ':' + parts.join(',');
}

window.copyShareLink = function(){
  const input = document.getElementById('share-link-input');
  const btn = document.getElementById('share-copy-btn');
  if(!input || !btn) return;
  const url = input.value;
  const ui = getUI();
  const originalText = btn.textContent;

  function showCopied(){
    btn.textContent = ui.linkCopied;
    setTimeout(() => { btn.textContent = originalText; }, 1800);
  }

  function fallbackCopy(){
    try {
      input.removeAttribute('readonly');
      input.focus();
      input.select();
      input.setSelectionRange(0, 99999);
      const ok = document.execCommand('copy');
      input.setAttribute('readonly', 'readonly');
      if(ok) showCopied();
    } catch(e){
      input.focus();
      input.select();
    }
  }

  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    navigator.clipboard.writeText(url).then(showCopied).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
};

function init(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  
  const topbar = document.createElement('div');
  topbar.className = 'topbar';
  
  const backBtn = document.createElement('button');
  backBtn.id = 'back-btn';
  backBtn.style.visibility = 'hidden';
  backBtn.textContent = getUI().backBtn;
  backBtn.onclick = goBack;
  
  const progText = document.createElement('div');
  progText.id = 'top-progress';
  
  topbar.appendChild(backBtn);
  topbar.appendChild(progText);
  app.appendChild(topbar);

  const main = document.createElement('main');
  main.id = 'main-content';
  app.appendChild(main);

  render();
}

function updateTopbar(){
  const backBtn = document.getElementById('back-btn');
  const progText = document.getElementById('top-progress');
  const topbar = document.querySelector('.topbar');
  const main = document.getElementById('main-content');
  const app = document.getElementById('app');
  const ui = getUI();

  const noChrome = (state === 'intro' || state === 'final' || state === 'shared');
  if(main) main.classList.toggle('intro-view', noChrome);
  if(app) app.classList.toggle('intro-app', noChrome);

  if(topbar) topbar.style.display = noChrome ? 'none' : '';

  if(state === 'intro' || state === 'final' || state === 'shared'){
    backBtn.style.visibility = 'hidden';
    progText.textContent = '';
  } else {
    backBtn.style.visibility = 'visible';
    const totalParts = getData().length;
    progText.textContent = `${ui.progressLabel} — ${partIndex + 1} / ${totalParts}`;
  }
}

function render(){
  updateTopbar();
  const main = document.getElementById('main-content');
  if(state === 'intro') return renderIntro(main);
  if(state === 'shared') return renderShared(main);
  if(state === 'question') return renderQuestion(main);
  if(state === 'part_result') return renderPartResult(main);
  if(state === 'final') return renderFinal(main);
}

function goBack(){
  if(navHistory.length === 0){
    state = 'intro';
    render();
    return;
  }
  const last = navHistory.pop();
  partIndex = last.partIndex;
  nodeId = last.nodeId;
  answers = last.answers;
  state = last.state;
  render();
}

    });
    if(n.noneOption){
      html += `<li><button class="opt-btn none-btn" style="margin-top:12px; font-weight:500;" data-val="none"><span class="check-icon"></span>${esc(n.noneOption)}</button></li>`;
    }
    html += `</ul>`;
    html += `<div class="error-msg" id="error-msg">${ui.errorSelectRequired}</div>`;
    html += `<button class="cta" style="margin-top:24px; width:100%;" onclick="submitMultiSelect()">${ui.continuePartPrefix}${partIndex+1} →</button>`;
  } else {
    html += `<ul class="options">`;
    n.options.forEach((opt, i) => {
      html += `<li><button class="opt-btn" onclick="selectOption(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(opt.label)}</button></li>`;
    });
    html += `</ul>`;
  }

  html += `</div>`;
  container.innerHTML = html;

  if(n.type === 'multi_select' || n.type === 'multi_bias'){
    const btns = container.querySelectorAll('.multi-btn');
    const noneBtn = container.querySelector('.none-btn');
    btns.forEach(b => {
      b.onclick = () => {
        b.classList.toggle('selected');
        if(noneBtn) noneBtn.classList.remove('selected');
      };
    });
    if(noneBtn){
      noneBtn.onclick = () => {
        btns.forEach(b => b.classList.remove('selected'));
        noneBtn.classList.add('selected');
      };
    }
  }
}

window.selectOption = function(idx){
  const n = currentPart().nodes[nodeId];
  const opt = n.options[idx];
  
  navHistory.push({partIndex, nodeId, answers:{...answers}, state});
  
  if(opt.set) answers[opt.set.key] = opt.set.value;
  
  nodeId = opt.next;
  const nextNode = currentPart().nodes[nodeId];
  
  if(nextNode.type === 'result' || nextNode.type === 'dynamicResult'){
    state = 'part_result';
  } else {
    state = 'question';
  }
  render();
};

window.submitMultiSelect = function(){
  const n = currentPart().nodes[nodeId];
  const container = document.getElementById('main-content');
  const selected = Array.from(container.querySelectorAll('.multi-btn.selected')).map(b => b.dataset.val);
  const noneSel = container.querySelector('.none-btn.selected');
  const err = document.getElementById('error-msg');

  if(selected.length === 0 && !noneSel){
    err.textContent = getUI().errorSelectRequired;
    err.style.display = 'block';
    return;
  }

  if(n.exclusiveGroups){
    for(const group of n.exclusiveGroups){
      const count = group.vals.filter(v => selected.includes(v)).length;
      if(count > 1){
        err.textContent = group.message;
        err.style.display = 'block';
        return;
      }
    }
  }

  err.style.display = 'none';

  navHistory.push({partIndex, nodeId, answers:{...answers}, state});

  const thisNodeId = nodeId;

  if(noneSel){
    answers[nodeId + '_selections'] = [];
    nodeId = n.nextIfNone;
  } else {
    answers[nodeId + '_selections'] = selected;
    nodeId = n.nextIfSelected;
  }

  if(thisNodeId === 'c4' &&
     (selected.includes('Animais Sencientes') || selected.includes('Sentient Animals'))){
    nodeId = 'c4_gradualism';
  }

  const nextNode = currentPart().nodes[nodeId];
  if(nextNode.type === 'result' || nextNode.type === 'dynamicResult'){
    state = 'part_result';
  } else {
    state = 'question';
  }
  render();
};

function renderPartResult(container){
  const ui = getUI();
  const p = currentPart();
  const n = p.nodes[nodeId];
  let r = n.type === 'dynamicResult' ? n.render(answers) : n;

  let html = `
    <div class="test-progress">
      <div class="test-progress-row">
        <span>${p.label} — Resultado</span>
      </div>
      <div class="test-progress-track">
        <div class="test-progress-fill" style="width: ${((partIndex+1) / getData().length) * 100}%"></div>
      </div>
    </div>
    <div class="card-container">
      <p class="result-tag">${esc(r.tag || p.label)}</p>
      <h2 class="result-title">${esc(r.title)}</h2>
      ${r.meta && r.meta.length > 0 ? `<div class="result-meta">${r.meta.map(m => `<div class="result-meta-item"><span class="meta-label">${esc(m.label)}:</span> <span class="meta-value">${esc(m.value)}</span></div>`).join('')}</div>` : ''}
      ${r.body.map(para => `<p class="lede">${esc(para)}</p>`).join('')}
  `;

  if(r.oppose){
    html += `<div class="result-oppose"><b>${ui.opposeLabel}</b> ${esc(r.oppose)}</div>`;
  }

  if(r.accordion && r.accordion.length > 0){
    html += `<div class="accordion-container">`;
    r.accordion.forEach((acc, i) => {
      html += `
        <div class="accordion-item" id="acc-${i}">
          <button class="accordion-header" onclick="document.getElementById('acc-${i}').classList.toggle('active')">
            ${esc(acc.title)}
          </button>
          <div class="accordion-body"><p>${esc(acc.text)}</p></div>
        </div>
      `;
    });
    html += `</div>`;
  }

  const isLast = partIndex === getData().length - 1;
  const btnText = isLast ? ui.continueFinal : (ui.continuePartPrefix + (partIndex + 2) + ' →');

  html += `<button class="cta" style="margin-top:20px;" onclick="continuePart()">${btnText}</button>`;
  html += `</div>`;
  
  container.innerHTML = html;
}

window.continuePart = function(){
  const p = currentPart(), n = p.nodes[nodeId]; 
  let r = n.type === 'dynamicResult' ? n.render(answers) : n;
  
  const level = r.level || answers.circleLevel || 3;
  
  partResults[partIndex] = {
    title: r.title, 
    tag: r.tag, 
    level: level, 
    desc: (r.body && r.body.length > 0) ? r.body[0] : '',
    meta: r.meta || null
  };
  
  navHistory.push({partIndex, nodeId, answers:{...answers}, state});
  
  if(partIndex < getData().length - 1){
    partIndex++;
    state = 'question';
    nodeId = currentPart().root;
    render();
  } else {
    state = 'final';
    render();
  }
};

function renderMoralMapSvg(level){
  const levelsCount = 6;
  const cx = 200, cy = 180, maxR = 150;
  let svg = `<svg class="moral-map-svg" viewBox="0 0 400 340">`;
  svg += `<defs>`;
  
  const labels = currentLang === 'en' 
    ? ['Self', 'Intimate Group', 'Social Group(s)', 'Species / Life', 'Partial Sentience', 'Broad Sentience']
    : ['Eu', 'Grupo Íntimo', 'Grupo(s) Social(is)', 'Espécie / Vida', 'Senciência parcial', 'Senciência ampla'];

  for(let i = 1; i <= levelsCount; i++){
    const r = (i / levelsCount) * maxR;
    svg += `<path id="circle-arc-${i}" d="M ${cx - r},${cy} A ${r},${r} 0 0,1 ${cx + r},${cy}" fill="none" stroke="none" />`;
  }
  svg += `</defs>`;

  for(let i = levelsCount; i >= 1; i--){
    const r = (i / levelsCount) * maxR;
    const isYou = (i === level);
    const fill = isYou ? 'rgba(217,119,6,0.12)' : 'transparent';
    const stroke = isYou ? 'var(--ethical-yellow)' : 'var(--line)';
    const strokeWidth = isYou ? '2.5' : '1';
    
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}"/>`;
    
    const labelClass = isYou ? 'map-you' : 'map-label';
    svg += `
      <text class="${labelClass}" dy="-3">
        <textPath href="#circle-arc-${i}" startOffset="50%" text-anchor="middle">
          ${esc(labels[i-1])}${isYou ? ' ★' : ''}
        </textPath>
      </text>
    `;
  }

  svg += `</svg>`;
  return svg;
}

function renderFinal(container){
  const ui = getUI();
  const circleResult = partResults[1];
  const circleLevel = circleResult ? circleResult.level : 3;
  
  const cards = partResults.map((r, i) => {
    let graphHtml = '';
    if (i === 1) { 
      graphHtml = `
        <div class="moral-map-inline">
          ${renderMoralMapSvg(circleLevel)}
        </div>
      `;
    }

    return `
      <div class="summary-card">
        <p class="stage">${esc(ui.stages[i] || ('Part ' + (i+1)))}</p>
        <h3>${esc(r.title || '')}</h3>
        ${r.tag ? `<p class="lede" style="font-size:13px; margin:0 0 8px 0; color:var(--ethical-blue);">${esc(r.tag)}</p>` : ''}
        ${r.meta && r.meta.length > 0 ? `<div class="result-meta" style="margin:0 0 12px;">${r.meta.map(m => `<div class="result-meta-item"><span class="meta-label">${esc(m.label)}:</span> <span class="meta-value">${esc(m.value)}</span></div>`).join('')}</div>` : ''}
        ${r.desc ? `<p class="lede" style="font-size:14px; margin:0;">${esc(r.desc)}</p>` : ''}
        ${graphHtml}
      </div>
    `;
  }).join('');

  let html = `
    <div class="card-container" style="padding:40px 32px;">
      <p class="kicker" style="text-align:center;">${ui.finalKicker}</p>
      <h1 style="text-align:center;">${ui.finalTitle}</h1>

      <div style="margin-top:32px;">
        ${cards}
      </div>

      <p class="lede" style="margin-top:32px; text-align:center;">${ui.closing[0]}</p>

      <div class="share-box">
        <h3 style="font-size:16px; margin:0 0 8px;">${ui.shareTitle}</h3>
        <p style="font-size:14px; margin:0; color:var(--muted);">${ui.shareText}</p>
        <div class="share-row">
          <input type="text" id="share-link-input" readonly value="${esc(buildShareUrl())}">
          <button class="lang-btn" id="share-copy-btn" onclick="copyShareLink()">${ui.copyLink}</button>
        </div>
      </div>

      <div style="text-align:center; margin-top:16px;">
        <a class="lang-btn" style="text-decoration:none; display:inline-block;" href="map.html" target="_blank" rel="noopener">${ui.mapButton}</a>
      </div>

      <div class="restart-btn-wrap">
        <button class="lang-btn" onclick="state='intro'; init()">${ui.restartBtn}</button>
      </div>

      <div class="credits-footer">
        <p style="margin:0 0 6px; font-weight:500;">${ui.offeringLabel}</p>
        <p style="margin:0 0 16px;">
          <a href="https://biblioverse.org" target="_blank" rel="noopener">biblioverse.org</a> &nbsp;|&nbsp; 
          <a href="https://senciencia.org" target="_blank" rel="noopener">senciencia.org</a> &nbsp;|&nbsp; 
          <a href="https://vegpedia.org" target="_blank" rel="noopener">vegpedia.org</a>
        </p>
        <p style="margin:0; font-size:13px; color:var(--ink-dim);">${ui.idealizedBy}</p>
      </div>
    </div>
  `;
  container.innerHTML = html;
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
