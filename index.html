<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Visão Moral — Compreenda como você pensa a ética</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ethical-blue: #2A52BE;
    --ethical-yellow: #D97706;
    --ethical-red: #DC2626;
    --ethical-teal: #0D9488;
    
    --bg: #f8f9fa;
    --panel: #ffffff;
    --panel-2: #f1f3f4;
    --line: #dadce0;
    --ink: #202124;
    --ink-dim: #3c4043;
    --muted: #5f6368;
    
    --accent: var(--ethical-blue);
    --accent-hover: #1e3a8a;
    --serif: 'Newsreader', Georgia, serif;
    --sans: 'Google Sans', 'Inter', system-ui, -apple-system, sans-serif;
    --maxw: 680px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.6;
  }

  .ethical-bar {
    height: 4px;
    width: 100%;
    background: linear-gradient(90deg, var(--ethical-blue) 0%, var(--ethical-yellow) 50%, var(--ethical-red) 100%);
  }

  #app {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 32px 24px 80px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 36px;
    margin-bottom: 24px;
    font-size: 14px;
    color: var(--muted);
  }

  .topbar button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 20px;
    transition: background 0.2s, color 0.2s;
  }
  .topbar button:hover { background: var(--panel-2); color: var(--ink); }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .rings { width: 110px; height: 110px; margin-bottom: 24px; }
  .rings circle {
    fill: none;
    stroke-width: 1.8;
    opacity: 0;
    transform-origin: center;
  }
  .rings circle:nth-child(1) { stroke: var(--ethical-blue); animation: ringIn 1s ease forwards 0.1s; }
  .rings circle:nth-child(2) { stroke: var(--ethical-yellow); animation: ringIn 1s ease forwards 0.3s; }
  .rings circle:nth-child(3) { stroke: var(--ethical-red); animation: ringIn 1s ease forwards 0.5s; }
  .rings circle:nth-child(4) { stroke: var(--ethical-teal); animation: ringIn 1s ease forwards 0.7s; }

  @keyframes ringIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }

  .card-container {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 1px 3px rgba(60,64,67,0.08), 0 4px 8px rgba(60,64,67,0.04);
  }

  .kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--ethical-blue);
    margin: 0 0 12px;
  }

  h1 {
    font-size: 30px;
    font-weight: 500;
    line-height: 1.3;
    margin: 0 0 16px;
    color: var(--ink);
    letter-spacing: -0.3px;
  }

  .lede { font-size: 15.5px; color: var(--ink-dim); margin: 0 0 16px; line-height: 1.65; }

  .parts-list {
    list-style: none;
    padding: 0;
    margin: 24px 0 32px;
    border-top: 1px solid var(--line);
  }
  .parts-list li {
    border-bottom: 1px solid var(--line);
    padding: 16px 0;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .parts-list .num {
    background: rgba(42, 82, 190, 0.1);
    color: var(--ethical-blue);
    font-weight: 700;
    font-size: 14px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .parts-list .txt strong { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }
  .parts-list .txt span { font-size: 14px; color: var(--muted); }

  button.cta {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 15px;
    background: linear-gradient(105deg, var(--ethical-blue), #3b82f6 50%, var(--ethical-red));
    color: #ffffff;
    border: none;
    padding: 12px 28px;
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    box-shadow: 0 1px 3px rgba(42,82,190,0.3);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  button.cta:hover { filter: brightness(1.1); box-shadow: 0 3px 8px rgba(42,82,190,0.25); }
  button.cta:active { transform: translateY(1px); }

  .lang-card {
    margin: 16px 0 24px;
    padding: 16px;
    background: var(--panel-2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
  }
  .lang-card p { margin: 0; color: var(--ink-dim); font-weight: 500; }
  .lang-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 8px 16px;
    border-radius: 20px;
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lang-btn:hover { border-color: var(--ethical-blue); color: var(--ethical-blue); }

  .part-label { font-size: 13px; font-weight: 600; color: var(--ethical-blue); margin: 0 0 12px; }
  .qtext {
    font-size: 22px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ink);
    margin: 0 0 28px;
  }

  .options { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .opt-btn {
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    padding: 16px 20px 16px 48px;
    position: relative;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .opt-btn .letter {
    position: absolute;
    left: 16px;
    top: 16px;
    font-weight: 700;
    color: var(--ethical-yellow);
    font-size: 14px;
  }
  .opt-btn:hover {
    border-color: var(--ethical-blue);
    background: rgba(42, 82, 190, 0.04);
    box-shadow: 0 1px 4px rgba(42, 82, 190, 0.12);
  }

  .opt-btn.selected {
    border-color: var(--ethical-yellow);
    background: rgba(217, 119, 6, 0.08);
  }

  .error-msg {
    color: var(--ethical-red);
    font-size: 14px;
    font-weight: 600;
    margin-top: 12px;
    display: none;
  }

  .test-progress {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: 12px 0;
    margin-bottom: 20px;
    background: var(--bg);
  }
  .test-progress-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .test-progress-track { height: 6px; width: 100%; border-radius: 3px; background: var(--line); overflow: hidden; }
  .test-progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--ethical-blue), var(--ethical-yellow), var(--ethical-red)); transition: width 0.35s ease; border-radius: 3px; }

  .accordion-container { margin: 24px 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .accordion-item { border-bottom: 1px solid var(--line); }
  .accordion-item:last-child { border-bottom: none; }
  .accordion-header {
    width: 100%;
    padding: 16px 20px;
    background: none;
    border: none;
    text-align: left;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s;
  }
  .accordion-header:hover { background: var(--panel-2); }
  .accordion-header::after { content: '+'; font-size: 18px; font-weight: 500; color: var(--ethical-yellow); }
  .accordion-item.active .accordion-header::after { content: '−'; }
  .accordion-body { padding: 0 20px 16px; display: none; font-size: 14.5px; color: var(--ink-dim); line-height: 1.65; }
  .accordion-item.active .accordion-body { display: block; }

  .moral-map-inline { 
    margin-top: 20px; 
    margin-bottom: 8px; 
    padding: 20px 16px; 
    border: 1px solid var(--line); 
    background: var(--panel-2); 
    border-radius: 12px; 
    text-align: center;
  }
  .moral-map-inline h4 { font-size: 16px; font-weight: 600; margin: 0 0 12px; color: var(--ink); }
  .moral-map-svg { display: block; width: 100%; max-width: 440px; margin: 0 auto; overflow: visible; }
  .map-label { font-size: 11px; fill: var(--muted); font-weight: 500; letter-spacing: 0.3px; }
  .map-you { font-size: 11.5px; fill: var(--ethical-yellow); font-weight: 700; letter-spacing: 0.5px; }

  .result-tag { font-size: 12px; font-weight: 700; color: var(--ethical-blue); text-transform: uppercase; margin: 0 0 8px; }
  .result-title { font-size: 26px; font-weight: 500; color: var(--ink); margin: 0 0 16px; }
  .result-oppose {
    margin: 20px 0;
    padding: 16px;
    background: rgba(220, 38, 38, 0.06);
    border-radius: 8px;
    border-left: 4px solid var(--ethical-red);
    font-size: 14px;
    color: #991b1b;
  }
  .result-oppose b { color: var(--ink); }

  .summary-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    background: var(--panel);
    box-shadow: 0 1px 2px rgba(60,64,67,0.05);
  }
  .summary-card .stage { font-size: 12px; font-weight: 700; color: var(--ethical-blue); margin: 0 0 6px; text-transform: uppercase; }
  .summary-card h3 { font-size: 20px; font-weight: 500; margin: 0 0 8px; color: var(--ink); }

  .share-box {
    margin-top: 36px;
    padding: 24px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 12px;
  }
  .share-row { display: flex; gap: 10px; margin-top: 12px; }
  .share-row input { flex: 1; border: 1px solid var(--line); padding: 10px 14px; border-radius: 20px; font: inherit; color: var(--ink); }

  .restart-btn-wrap { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; }

  .credits-footer {
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 13.5px;
    color: var(--muted);
  }
  .credits-footer a {
    color: var(--ethical-blue);
    text-decoration: none;
    font-weight: 600;
  }
  .credits-footer a:hover { text-decoration: underline; }

  .privacy-note {
    margin: 20px 0;
    padding: 12px 16px;
    border-radius: 8px;
    background: var(--panel-2);
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="ethical-bar"></div>
<div id="app"></div>

<script>
function detectLang(){
  try {
    const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
    for(const l of langs){ if(l && /^pt/i.test(l)) return 'pt'; }
  } catch(e){}
  return 'en';
}

let currentLang = detectLang();

const UI_PT = {
  kickerIntro:'TESTE ÉTICO',

  partsListItems:[

  kickerIntro:'ETHICAL TEST',
  titleIntro:'What is your moral worldview?',
  ledeIntro:'Every decision involving other beings carries a theory about how we should act, who deserves consideration, and what it means to call something "right" or "wrong". This quiz helps name the foundations you already use.',

const PARTS_PT = [
  {
    key:'theory', label:'Parte 1 · Teoria ética normativa', root:'t1',
    nodes:{
      t1:{type:'question', text:'Você acredita que existe algum tipo de verdade moral que vale para todos — independentemente de cultura, época ou opinião de cada pessoa — mesmo que seja difícil descobri-la?', options:[
        {label:'Não — o que é certo ou errado depende inteiramente de quem julga', next:'t_relativismo'},
        {label:'Sim, ou pelo menos vale a pena investigar essa possibilidade a sério', next:'t2'},
      ]},
      t_relativismo:{type:'question', text:'Qual dessas descrições de relativismo ou ceticismo melhor descreve sua posição?', options:[
        {label:'O certo depende das normas de cada cultura ou sociedade', next:'r_cultural'},
        {label:'Depende do julgamento ou sentimento de cada pessoa', next:'r_individual'},
        {label:'Reconheço que as normas variam, sem descartar uma verdade moral objetiva por trás disso', next:'r_descritivo'},

      ]},
      r_cultural:{type:'result', tag:'Ética normativa · Relativismo', title:'Relativismo cultural', body:['O que é moralmente certo ou errado depende das normas vigentes em cada cultura ou sociedade. Não existe um padrão externo válido para julgar culturas a partir de fora.']},
      r_individual:{type:'result', tag:'Ética normativa · Relativismo', title:'Relativismo individual (Subjetivismo)', body:['O que é certo ou errado depende do julgamento, sentimento ou preferência pessoal de cada indivíduo. A moralidade é, em última instância, uma escolha subjetiva.']},
      r_descritivo:{type:'result', tag:'Ética normativa · Relativismo', title:'Relativismo meramente descritivo', body:['Você reconhece a variação sociocultural das normas como um fato empírico, mas isso não exclui a existência de uma verdade moral objetiva subjacente.']},
      r_apontar_meta:{type:'result', tag:'Isso é metaética, não teoria normativa', title:'Não-cognitivismo / Expressivismo', body:['Essa é uma posição sobre a natureza dos juízos morais (metaética), e não uma teoria normativa sobre como agir. Ela será explorada na Parte 3.']},

      t2:{type:'question', text:'Ao decidir se uma ação é certa ou errada, o que você considera fundamental?', options:[
        {label:'O resultado da escolha: se o mundo que resulta dela é melhor que as alternativas', next:'t3_ato_regra'},

        {label:'O tipo de pessoa que a pratica, e os traços de caráter que ela expressa', next:'t_character'},

      ]},
      
      t_divine:{type:'question', text:'Qual dessas visões sobre a relação entre o certo e Deus descreve melhor sua posição?', options:[
        {label:'Algo é bom simplesmente porque Deus o ordena; não há padrão de bondade independente da vontade divina', next:'r_divine_a'},
        {label:'Deus ordena o que é bom porque é, por natureza, perfeitamente amoroso; a vontade divina expressa a bondade, não a cria arbitrariamente', next:'r_divine_b'},
      ]},
      r_divine_a:{type:'result', tag:'Ética normativa', title:'Teoria do Mandamento Divino (Tradicional)', body:['Uma ação é certa porque é ordenada por Deus e errada porque é proibida. O fundamento último da moralidade reside puramente na vontade e na natureza divina.']},
      r_divine_b:{type:'result', tag:'Ética normativa', title:'Teoria do Mandamento Divino (Modificada)', body:['Deus ordena o que é bom porque sua própria natureza é perfeitamente amorosa — a vontade divina expressa a bondade, mas não a cria de forma arbitrária.']},

      t_deontology:{type:'question', text:'Qual dessas visões sobre deveres morais melhor descreve a sua?', options:[
        {label:'Certas restrições morais jamais podem ser violadas, custe o que custar', next:'r_deon_a'},
        {label:'Valem na maioria dos casos, mas cedem se as consequências forem catastróficas', next:'r_deon_b'},

      r_deon_a:{type:'result', tag:'Ética normativa', title:'Deontologia Absolutista', body:['Certas restrições (ex: não mentir, não matar inocentes) jamais podem ser violadas, mesmo que segui-las implique um resultado pior. O dever moral é absoluto.']},
      r_deon_b:{type:'result', tag:'Ética normativa', title:'Deontologia Moderada (de Limiar)', body:['As restrições valem na grande maioria dos casos, mas podem ser violadas se as consequências de segui-las forem catastróficas o bastante.']},
      r_deon_c:{type:'result', tag:'Ética normativa', title:'Deontologia de Direitos', body:['O que fundamenta suas restrições é o respeito a direitos morais básicos. Violar um direito é errado independentemente das consequências.']},
      r_deon_d:{type:'result', tag:'Ética normativa', title:'Doutrina do Duplo Efeito', body:['O que mais importa é se o dano foi pretendido como meio para um fim, ou apenas previsto como um efeito colateral não intencional de uma boa ação.']},

      t_character:{type:'question', text:'Ao focar na pessoa que age, o que você considera mais fundamental?', options:[
        {label:'Cultivar virtudes (coragem, justiça, compaixão) valiosas em si mesmas', next:'r_char_a'},
        {label:'Cultivar a disposição de cuidar de relações e dos mais vulneráveis', next:'r_char_b'},

        {label:'Ensuring everyone reaches a minimum sufficient level of well-being', next:'t_conseq_neg', set:{key:'aggreg', value:'Sufficientarianism'}},

      t_conseq_neg:{type:'question', text:'What about the weight of suffering compared to positive well-being?', options:[

      t_conseq_result:{type:'dynamicResult', tag:'Normative Ethics · Consequentialism', render: function(a){

          resultLevel = 6;

        else if(score <= 7) res = 'moderada';

function getData(){ return currentLang === 'en' ? PARTS_EN : PARTS_PT; }
function getUI(){ return currentLang === 'en' ? UI_EN : UI_PT; }

let state = 'intro'; // intro, question, part_result, final
let partIndex = 0;
let nodeId = null;
let answers = {};
let partResults = [];
let navHistory = [];

function esc(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function init(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  
  const topbar = document.createElement('div');
  topbar.className = 'topbar';
  
  const backBtn = document.createElement('button');
  backBtn.id = 'back-btn';
  backBtn.style.visibility = 'hidden';
  backBtn.textContent = getUI().backBtn;
  backBtn.onclick = goBack;
  
  const progText = document.createElement('div');
  progText.id = 'top-progress';
  
  topbar.appendChild(backBtn);
  topbar.appendChild(progText);
  app.appendChild(topbar);

  const main = document.createElement('main');
  main.id = 'main-content';
  app.appendChild(main);

  render();
}

function updateTopbar(){
  const backBtn = document.getElementById('back-btn');
  const progText = document.getElementById('top-progress');
  const ui = getUI();

  if(state === 'intro' || state === 'final'){
    backBtn.style.visibility = 'hidden';
    progText.textContent = '';
  } else {
    backBtn.style.visibility = navHistory.length > 0 ? 'visible' : 'hidden';
    const totalParts = getData().length;
    progText.textContent = `${ui.progressLabel} — ${partIndex + 1} / ${totalParts}`;
  }
}

function render(){
  updateTopbar();
  const main = document.getElementById('main-content');
  if(state === 'intro') return renderIntro(main);
  if(state === 'question') return renderQuestion(main);
  if(state === 'part_result') return renderPartResult(main);
  if(state === 'final') return renderFinal(main);
}

function renderIntro(container){
  const ui = getUI();
  
  let html = `
    <div class="lang-card">
      <p>${ui.langPrompt}</p>
      <button class="lang-btn" onclick="switchLang()">${ui.langSwitchText}</button>
    </div>
    <div class="card-container">
      <div style="text-align:center;">
        <svg class="rings" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="15"></circle>
          <circle cx="50" cy="50" r="28"></circle>
          <circle cx="50" cy="50" r="41"></circle>
        </svg>
      </div>
      <p class="kicker" style="text-align:center;">${ui.kickerIntro}</p>
      <h1 style="text-align:center;">${ui.titleIntro}</h1>
      <p class="lede" style="text-align:center; max-width:540px; margin:0 auto 24px;">${ui.ledeIntro}</p>
      
      <ul class="parts-list">
        ${ui.partsListItems.map(item => `
          <li>
            <div class="num">${item[0]}</div>
            <div class="txt"><strong>${item[1]}</strong><span>${item[2]}</span></div>
          </li>
        `).join('')}
      </ul>

      <div style="text-align:center;">
        <button class="cta" onclick="startTest()">${ui.ctaStart}</button>
        <p class="privacy-note">${ui.privacyNote}</p>
      </div>
    </div>
  `;
  container.innerHTML = html;
}

function switchLang(){
  currentLang = currentLang === 'en' ? 'pt' : 'en';
  document.documentElement.lang = currentLang === 'pt' ? 'pt-BR' : 'en';
  init();
}

function startTest(){
  partIndex = 0;
  answers = {};
  partResults = [];
  navHistory = [];
  state = 'question';
  nodeId = getData()[partIndex].root;
  render();
}

function goBack(){
  if(navHistory.length === 0) return;
  const last = navHistory.pop();
  partIndex = last.partIndex;
  nodeId = last.nodeId;
  answers = last.answers;
  state = last.state;
  render();
}

function currentPart(){ return getData()[partIndex]; }

function renderQuestion(container){
  const ui = getUI();
  const p = currentPart();
  const n = p.nodes[nodeId];

  let html = `
    <div class="test-progress">
      <div class="test-progress-row">
        <span>${p.label}</span>
      </div>
      <div class="test-progress-track">
        <div class="test-progress-fill" style="width: ${(partIndex / getData().length) * 100}%"></div>
      </div>
    </div>
    
    <div class="card-container">
      <p class="part-label">${p.label}</p>
      <h2 class="qtext">${esc(n.text)}</h2>
  `;

  if(n.type === 'multi_bias'){
    html += `<ul class="options" id="multi-opts">`;
    n.options.forEach((opt, i) => {
      html += `<li><button class="opt-btn multi-btn" data-val="${opt.val}"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(opt.label)}</button></li>`;
    });
    html += `<li><button class="opt-btn none-btn" style="margin-top:12px; font-weight:500;" data-val="none">${esc(n.noneOption)}</button></li></ul>`;
    html += `<div class="error-msg" id="error-msg">${ui.errorSelectRequired}</div>`;
    html += `<button class="cta" style="margin-top:24px; width:100%;" onclick="submitMultiBias()">${ui.continuePartPrefix}${partIndex+1} →</button>`;
  } else {
    html += `<ul class="options">`;
    n.options.forEach((opt, i) => {
      html += `<li><button class="opt-btn" onclick="selectOption(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(opt.label)}</button></li>`;
    });
    html += `</ul>`;
  }

  html += `</div>`;
  container.innerHTML = html;

  if(n.type === 'multi_bias'){
    const btns = container.querySelectorAll('.multi-btn');
    const noneBtn = container.querySelector('.none-btn');
    btns.forEach(b => {
      b.onclick = () => {
        b.classList.toggle('selected');
        noneBtn.classList.remove('selected');
      };
    });
    noneBtn.onclick = () => {
      btns.forEach(b => b.classList.remove('selected'));
      noneBtn.classList.add('selected');
    };
  }
}

window.selectOption = function(idx){
  const n = currentPart().nodes[nodeId];
  const opt = n.options[idx];
  
  navHistory.push({partIndex, nodeId, answers:{...answers}, state});
  
  if(opt.set) answers[opt.set.key] = opt.set.value;
  
  nodeId = opt.next;
  const nextNode = currentPart().nodes[nodeId];
  
  if(nextNode.type === 'result' || nextNode.type === 'dynamicResult'){
    state = 'part_result';
  } else {
    state = 'question';
  }
  render();
};

window.submitMultiBias = function(){
  const n = currentPart().nodes[nodeId];
  const container = document.getElementById('main-content');
  const selected = Array.from(container.querySelectorAll('.multi-btn.selected')).map(b => b.dataset.val);
  const noneSel = container.querySelector('.none-btn.selected');
  const err = document.getElementById('error-msg');
  
  if(selected.length === 0 && !noneSel){
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';

  navHistory.push({partIndex, nodeId, answers:{...answers}, state});

  if(noneSel){
    nodeId = n.nextIfNone;
  } else {
    answers.selectedBiases = selected;
    nodeId = n.nextIfSelected;
  }

  const nextNode = currentPart().nodes[nodeId];
  if(nextNode.type === 'result' || nextNode.type === 'dynamicResult'){
    state = 'part_result';
  } else {
    state = 'question';
  }
  render();
};

function renderPartResult(container){
  const ui = getUI();
  const p = currentPart();
  const n = p.nodes[nodeId];
  let r = n.type === 'dynamicResult' ? n.render(answers) : n;

  let html = `
    <div class="test-progress">
      <div class="test-progress-row">
        <span>${p.label} — Resultado</span>
      </div>
      <div class="test-progress-track">
        <div class="test-progress-fill" style="width: ${((partIndex+1) / getData().length) * 100}%"></div>
      </div>
    </div>
    <div class="card-container">
      <p class="result-tag">${esc(r.tag || p.label)}</p>
      <h2 class="result-title">${esc(r.title)}</h2>
      ${r.body.map(para => `<p class="lede">${esc(para)}</p>`).join('')}
  `;

  if(r.oppose){
    html += `<div class="result-oppose"><b>${ui.opposeLabel}</b> ${esc(r.oppose)}</div>`;
  }

  if(r.accordion && r.accordion.length > 0){
    html += `<div class="accordion-container">`;
    r.accordion.forEach((acc, i) => {
      html += `
        <div class="accordion-item" id="acc-${i}">
          <button class="accordion-header" onclick="document.getElementById('acc-${i}').classList.toggle('active')">
            ${esc(acc.title)}
          </button>
          <div class="accordion-body"><p>${esc(acc.text)}</p></div>
        </div>
      `;
    });
    html += `</div>`;
  }

  const isLast = partIndex === getData().length - 1;
  const btnText = isLast ? ui.continueFinal : (ui.continuePartPrefix + (partIndex + 2) + ' →');

  html += `<button class="cta" style="margin-top:20px;" onclick="continuePart()">${btnText}</button>`;
  html += `</div>`;
  
  container.innerHTML = html;
}

window.continuePart = function(){
  const p = currentPart(), n = p.nodes[nodeId]; 
  let r = n.type === 'dynamicResult' ? n.render(answers) : n;
  
  const level = r.level || answers.circleLevel || 3;
  
  partResults[partIndex] = {
    title: r.title, 
    tag: r.tag, 
    level: level, 
    desc: (r.body && r.body.length > 0) ? r.body[0] : ''
  };
  
  navHistory.push({partIndex, nodeId, answers:{...answers}, state});
  
  if(partIndex < getData().length - 1){
    partIndex++;
    state = 'question';
    nodeId = currentPart().root;
    render();
  } else {
    state = 'final';
    render();
  }
};

function renderMoralMapSvg(level){
  const levelsCount = 6;
  const cx = 200, cy = 180, maxR = 150;
  let svg = `<svg class="moral-map-svg" viewBox="0 0 400 340">`;
  svg += `<defs>`;
  
  const labels = currentLang === 'en' 
    ? ['Self', 'Intimate Group', 'Social Group(s)', 'Species / Life', 'Partial Sentience', 'Broad Sentience']
    : ['Eu', 'Grupo Íntimo', 'Grupo(s) Social(is)', 'Espécie / Vida', 'Senciência parcial', 'Senciência ampla'];

  for(let i = 1; i <= levelsCount; i++){
    const r = (i / levelsCount) * maxR;
    svg += `<path id="circle-arc-${i}" d="M ${cx - r},${cy} A ${r},${r} 0 0,1 ${cx + r},${cy}" fill="none" stroke="none" />`;
  }
  svg += `</defs>`;

  for(let i = levelsCount; i >= 1; i--){
    const r = (i / levelsCount) * maxR;
    const isYou = (i === level);
    const fill = isYou ? 'rgba(217,119,6,0.12)' : 'transparent';
    const stroke = isYou ? 'var(--ethical-yellow)' : 'var(--line)';
    const strokeWidth = isYou ? '2.5' : '1';
    
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeWidth}"/>`;
    
    const labelClass = isYou ? 'map-you' : 'map-label';
    svg += `
      <text class="${labelClass}" dy="-3">
        <textPath href="#circle-arc-${i}" startOffset="50%" text-anchor="middle">
          ${esc(labels[i-1])}${isYou ? ' ★' : ''}
        </textPath>
      </text>
    `;
  }

  svg += `</svg>`;
  return svg;
}

function renderFinal(container){
  const ui = getUI();
  const circleResult = partResults[1];
  const circleLevel = circleResult ? circleResult.level : 3;
  
  const cards = partResults.map((r, i) => {
    let graphHtml = '';
    if (i === 1) { // Parte 2: Fronteira do Círculo Moral
      graphHtml = `
        <div class="moral-map-inline">
          <h4>${ui.stages[1]}</h4>
          ${renderMoralMapSvg(circleLevel)}
        </div>
      `;
    }

    return `
      <div class="summary-card">
        <p class="stage">${esc(ui.stages[i] || ('Part ' + (i+1)))}</p>
        <h3>${esc(r.title || '')}</h3>
        ${r.tag ? `<p class="lede" style="font-size:13px; margin:0 0 8px 0; color:var(--ethical-blue);">${esc(r.tag)}</p>` : ''}
        ${r.desc ? `<p class="lede" style="font-size:14px; margin:0;">${esc(r.desc)}</p>` : ''}
        ${graphHtml}
      </div>
    `;
  }).join('');

  let html = `
    <div class="card-container" style="padding:40px 32px;">
      <p class="kicker" style="text-align:center;">${ui.finalKicker}</p>
      <h1 style="text-align:center;">${ui.finalTitle}</h1>

      <div style="margin-top:32px;">
        ${cards}
      </div>

      <p class="lede" style="margin-top:32px; text-align:center;">${ui.closing[0]}</p>

      <div class="share-box">
        <h3 style="font-size:16px; margin:0 0 8px;">${ui.shareTitle}</h3>
        <p style="font-size:14px; margin:0; color:var(--muted);">${ui.shareText}</p>
        <div class="share-row">
          <input type="text" readonly value="https://exemplo.com/resultado">
          <button class="lang-btn">${ui.copyLink}</button>
        </div>
      </div>

      <div class="restart-btn-wrap">
        <button class="lang-btn" onclick="state='intro'; init()">${ui.restartBtn}</button>
      </div>

      <div class="credits-footer">
        <p style="margin:0 0 6px; font-weight:500;">${ui.offeringLabel}</p>
        <p style="margin:0 0 16px;">
          <a href="https://biblioverse.org" target="_blank" rel="noopener">biblioverse.org</a> &nbsp;|&nbsp; 
          <a href="https://senciencia.org" target="_blank" rel="noopener">senciencia.org</a> &nbsp;|&nbsp; 
          <a href="https://vegpedia.org" target="_blank" rel="noopener">vegpedia.org</a>
        </p>
        <p style="margin:0; font-size:13px; color:var(--ink-dim);">${ui.idealizedBy}</p>
      </div>
    </div>
  `;
  container.innerHTML = html;
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
